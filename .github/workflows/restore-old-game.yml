name: Restore Old Game

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Restore repository from commit 0d29331
        run: |
          git rm -r .
          git checkout 0d29331 -- .
          git add -A
          git commit -m "Restore old game from 0d29331"
          git push origin HEAD:main
