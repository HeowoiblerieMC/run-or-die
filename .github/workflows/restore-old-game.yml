name: Restore Old Game

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create backup branch
        run: |
          git branch -f backup-before-restore origin/main
          git push --force origin backup-before-restore

      - name: Restore old game
        run: |
          git reset --hard 0d29331
          git push --force origin HEAD:main
