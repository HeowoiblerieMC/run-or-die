<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#03070b">
  <title>Run For Live</title>
</head>
<body>
  <div id="app"><div id="startup-status"><h1>RUN FOR LIVE</h1><p>Starting game...</p></div></div>
  <script type="module">
    const status = document.querySelector("#startup-status");
    const showError = error => {
      if (!status) return;
      status.innerHTML = "";
      const title = document.createElement("h1");
      title.textContent = "STARTUP ERROR";
      const details = document.createElement("pre");
      details.style.cssText = "max-width:90vw;padding:16px;white-space:pre-wrap;color:#ff6b6b;background:#120708;border:1px solid #7f1d1d;border-radius:8px";
      details.textContent = error?.stack || error?.message || String(error);
      status.append(title, details);
    };
    addEventListener("error", event => showError(event.error || event.message));
    addEventListener("unhandledrejection", event => showError(event.reason));
    import("./src/main.js").catch(showError);
  </script>
</body>
</html>
